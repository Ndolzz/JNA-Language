[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jna-language"
version = "0.1.0"
description = "JNA - Jawa Ngapak Absurd programming language"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "naze"}]

[project.scripts]
jna = "jna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
